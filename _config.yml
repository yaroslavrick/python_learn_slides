title: Python Course
description: Slide-deck-driven course covering Python, Django, FastAPI, testing, and more.

baseurl: "/python_learn_slides"
url: "https://yaroslavrick.github.io"

markdown: kramdown
markdown_ext: "markdown,md"
kramdown:
  input: GFM
  hard_wrap: false

defaults:
  - scope:
      path: "slides"
    values:
      layout: slide

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - NOTICES.md
  - vendor/bundle
  - vendor/cache
