<svg viewBox="0 0 320 160" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Layered architecture: View, Service, Model, Database">
  <g font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#3a3a40">
    <rect x="60" y="14"  width="200" height="26" rx="4" fill="#a8e6c1" stroke="#3a3a40" stroke-width="1.5"/>
    <text x="160" y="32" text-anchor="middle">View (HTTP only)</text>
    <line x1="160" y1="40" x2="160" y2="50" stroke="#3a3a40" stroke-width="1.5"/>
    <polygon points="157,48 160,52 163,48" fill="#3a3a40"/>

    <rect x="60" y="52"  width="200" height="26" rx="4" fill="#1ea366" stroke="#3a3a40" stroke-width="1.5"/>
    <text x="160" y="70" text-anchor="middle" fill="#fff">Service (business logic)</text>
    <line x1="160" y1="78" x2="160" y2="88" stroke="#3a3a40" stroke-width="1.5"/>
    <polygon points="157,86 160,90 163,86" fill="#3a3a40"/>

    <rect x="60" y="90"  width="200" height="26" rx="4" fill="#0c4b33" stroke="#3a3a40" stroke-width="1.5"/>
    <text x="160" y="108" text-anchor="middle" fill="#fff">Model + QuerySet</text>
    <line x1="160" y1="116" x2="160" y2="126" stroke="#3a3a40" stroke-width="1.5"/>
    <polygon points="157,124 160,128 163,124" fill="#3a3a40"/>

    <rect x="60" y="128" width="200" height="26" rx="4" fill="#aaa" stroke="#3a3a40" stroke-width="1.5"/>
    <text x="160" y="146" text-anchor="middle">Database</text>
  </g>
</svg>
