    <!-- Row 1 -->
    <rect x="40"  y="30" width="36" height="36" rx="4" fill="#fec03f"/>
    <rect x="84"  y="30" width="36" height="36" rx="4" fill="#1f8fff"/>
    <rect x="128" y="30" width="36" height="36" rx="4" fill="#28a745"/>
    <rect x="172" y="30" width="36" height="36" rx="4" fill="#fec03f"/>
