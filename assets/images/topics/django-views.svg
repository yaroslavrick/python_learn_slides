<svg viewBox="0 0 320 160" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Request to view to response">
  <g font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#3a3a40">
    <rect x="10" y="60" width="76" height="40" rx="4" fill="#fff" stroke="#3a3a40" stroke-width="1.5"/>
    <text x="48" y="78" text-anchor="middle">request</text>
    <text x="48" y="92" text-anchor="middle" font-size="9">(GET /...)</text>
    <line x1="86" y1="80" x2="116" y2="80" stroke="#3a3a40" stroke-width="1.5"/>
    <polygon points="114,77 120,80 114,83" fill="#3a3a40"/>
    <rect x="120" y="50" width="80" height="60" rx="4" fill="#1ea366" stroke="#3a3a40" stroke-width="1.5"/>
    <text x="160" y="76" text-anchor="middle" fill="#fff">view</text>
    <text x="160" y="92" text-anchor="middle" fill="#fff" font-size="9">def / class</text>
    <line x1="200" y1="80" x2="230" y2="80" stroke="#3a3a40" stroke-width="1.5"/>
    <polygon points="228,77 234,80 228,83" fill="#3a3a40"/>
    <rect x="234" y="60" width="76" height="40" rx="4" fill="#fff" stroke="#3a3a40" stroke-width="1.5"/>
    <text x="272" y="78" text-anchor="middle">response</text>
    <text x="272" y="92" text-anchor="middle" font-size="9">200 OK</text>
  </g>
</svg>
