<svg viewBox="0 0 320 160" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Padlock with a key — authentication">
  <g stroke="#3a3a40" stroke-width="2" fill="#3a3a40">
    <!-- Padlock body -->
    <rect x="120" y="60" width="80" height="70" rx="6" fill="#fec03f"/>
    <!-- Shackle -->
    <path d="M 135 60 L 135 40 Q 135 20 160 20 Q 185 20 185 40 L 185 60" fill="none" stroke-linecap="round" stroke-width="6"/>
    <!-- Keyhole -->
    <circle cx="160" cy="92" r="6" fill="#3a3a40"/>
    <rect x="158" y="92" width="4" height="14" fill="#3a3a40"/>
  </g>
  <!-- Key -->
  <g transform="translate(40 90) rotate(-20)" stroke="#3a3a40" stroke-width="2" stroke-linejoin="round">
    <circle cx="10" cy="10" r="10" fill="#aaa"/>
    <circle cx="10" cy="10" r="4" fill="#fff"/>
    <rect x="20" y="6" width="40" height="8" fill="#aaa"/>
    <rect x="48" y="14" width="4" height="8" fill="#aaa"/>
    <rect x="56" y="14" width="4" height="6" fill="#aaa"/>
  </g>
</svg>
