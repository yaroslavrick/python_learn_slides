<svg viewBox="0 0 320 160" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Git Flow with main, develop, feature branches">
  <g font-family="ui-monospace, Menlo, monospace" font-size="9" fill="#3a3a40">
    <text x="14" y="34" font-size="9">main</text>
    <line x1="58" y1="30" x2="300" y2="30" stroke="#3a3a40" stroke-width="2"/>
    <circle cx="80" cy="30" r="6" fill="#1f8fff" stroke="#3a3a40"/>
    <circle cx="180" cy="30" r="6" fill="#1f8fff" stroke="#3a3a40"/>
    <circle cx="270" cy="30" r="6" fill="#1f8fff" stroke="#3a3a40"/>

    <text x="14" y="84" font-size="9">develop</text>
    <line x1="58" y1="80" x2="300" y2="80" stroke="#3a3a40" stroke-width="2"/>
    <circle cx="100" cy="80" r="6" fill="#28a745" stroke="#3a3a40"/>
    <circle cx="160" cy="80" r="6" fill="#28a745" stroke="#3a3a40"/>
    <circle cx="220" cy="80" r="6" fill="#28a745" stroke="#3a3a40"/>
    <circle cx="280" cy="80" r="6" fill="#28a745" stroke="#3a3a40"/>

    <text x="14" y="134" font-size="9">feature</text>
    <line x1="100" y1="80" x2="140" y2="120" stroke="#fec03f" stroke-width="2"/>
    <line x1="140" y1="120" x2="160" y2="80" stroke="#fec03f" stroke-width="2"/>
    <circle cx="140" cy="120" r="6" fill="#fec03f" stroke="#3a3a40"/>

    <line x1="220" y1="80" x2="180" y2="30" stroke="#1f8fff" stroke-width="2" stroke-dasharray="3 2"/>
    <line x1="280" y1="80" x2="270" y2="30" stroke="#1f8fff" stroke-width="2" stroke-dasharray="3 2"/>
  </g>
</svg>
