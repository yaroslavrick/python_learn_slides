<svg viewBox="0 0 320 160" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Lightning-fast typed handler producing JSON">
  <g font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#3a3a40">
    <!-- Type-hinted signature box -->
    <rect x="14" y="34" width="170" height="58" rx="6" fill="#1f1f23" stroke="#3a3a40" stroke-width="1.5"/>
    <text x="26" y="56" fill="#c586c0">async def</text>
    <text x="92" y="56" fill="#dcdcaa">read</text>
    <text x="120" y="56" fill="#fff">(</text>
    <text x="126" y="56" fill="#9cdcfe">id:</text>
    <text x="148" y="56" fill="#4ec9b0">int</text>
    <text x="168" y="56" fill="#fff">)</text>
    <text x="26" y="76" fill="#aaa">→</text>
    <text x="44" y="76" fill="#4ec9b0">PostOut</text>
    <text x="100" y="76" fill="#fff">:</text>
    <text x="36" y="86" font-size="9" fill="#aaa">  ...</text>
    <!-- Lightning bolt -->
    <path d="M 200 30 L 220 30 L 210 60 L 230 60 L 200 110 L 215 80 L 198 80 Z" fill="#fec03f" stroke="#3a3a40" stroke-width="1.5" stroke-linejoin="round"/>
    <!-- JSON brace -->
    <text x="244" y="64" font-size="20" fill="#28a745">{ }</text>
    <text x="244" y="86" font-size="9" fill="#3a3a40">JSON</text>
  </g>
</svg>
