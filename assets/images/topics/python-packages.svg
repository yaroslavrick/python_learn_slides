<svg viewBox="0 0 320 160" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Stack of labeled package boxes">
  <g stroke="#3a3a40" stroke-width="2" font-family="ui-monospace, Menlo, monospace" font-size="11">
    <!-- Bottom box -->
    <rect x="60" y="100" width="200" height="40" fill="#cdb380"/>
    <line x1="160" y1="100" x2="160" y2="140" stroke-width="1" stroke-dasharray="3 2"/>
    <text x="160" y="125" text-anchor="middle" fill="#3a3a40">requests-2.32.3</text>
    <!-- Middle box -->
    <rect x="80" y="65" width="180" height="35" fill="#e6cf99"/>
    <line x1="170" y1="65" x2="170" y2="100" stroke-width="1" stroke-dasharray="3 2"/>
    <text x="170" y="88" text-anchor="middle" fill="#3a3a40">click-8.1.7</text>
    <!-- Top box -->
    <rect x="100" y="35" width="160" height="30" fill="#f4dfab"/>
