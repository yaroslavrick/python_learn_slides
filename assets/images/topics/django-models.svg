<svg viewBox="0 0 320 160" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Author with one-to-many to Post, with many-to-many to Tag">
  <g font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#3a3a40">
    <!-- Author -->
    <rect x="20" y="60" width="80" height="40" rx="4" fill="#fff" stroke="#3a3a40" stroke-width="1.5"/>
    <text x="60" y="84" text-anchor="middle">Author</text>
    <!-- Post (middle) -->
    <rect x="120" y="60" width="80" height="40" rx="4" fill="#1ea366" stroke="#3a3a40" stroke-width="1.5"/>
    <text x="160" y="84" text-anchor="middle" fill="#fff">Post</text>
    <!-- Tag -->
    <rect x="220" y="60" width="80" height="40" rx="4" fill="#fec03f" stroke="#3a3a40" stroke-width="1.5"/>
    <text x="260" y="84" text-anchor="middle">Tag</text>
    <!-- 1-to-many edge: Author → Post -->
    <line x1="100" y1="80" x2="120" y2="80" stroke="#3a3a40" stroke-width="1.5"/>
    <text x="110" y="74" text-anchor="middle" font-size="9">1—N</text>
    <!-- many-to-many: Post ↔ Tag -->
    <line x1="200" y1="80" x2="220" y2="80" stroke="#3a3a40" stroke-width="1.5"/>
    <text x="210" y="74" text-anchor="middle" font-size="9">M—N</text>
    <!-- Crow's-feet hints -->
    <line x1="116" y1="76" x2="120" y2="80" stroke="#3a3a40" stroke-width="1.5"/>
    <line x1="116" y1="84" x2="120" y2="80" stroke="#3a3a40" stroke-width="1.5"/>
    <line x1="220" y1="80" x2="216" y2="76" stroke="#3a3a40" stroke-width="1.5"/>
    <line x1="220" y1="80" x2="216" y2="84" stroke="#3a3a40" stroke-width="1.5"/>
    <line x1="200" y1="80" x2="204" y2="76" stroke="#3a3a40" stroke-width="1.5"/>
    <line x1="200" y1="80" x2="204" y2="84" stroke="#3a3a40" stroke-width="1.5"/>
    <line x1="100" y1="80" x2="104" y2="76" stroke="#3a3a40" stroke-width="1.5"/>
    <line x1="100" y1="80" x2="104" y2="84" stroke="#3a3a40" stroke-width="1.5"/>
  </g>
</svg>
