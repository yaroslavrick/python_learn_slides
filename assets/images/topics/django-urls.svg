<svg viewBox="0 0 320 160" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="URL pattern matching a request path to a view">
  <g font-family="ui-monospace, Menlo, monospace" font-size="13" fill="#3a3a40">
    <!-- Request -->
    <rect x="10" y="62" width="86" height="36" rx="4" fill="#fff" stroke="#3a3a40" stroke-width="1.5"/>
    <text x="53" y="80" text-anchor="middle" font-size="11">/blog/42/</text>
    <text x="53" y="94" text-anchor="middle" font-size="9">request</text>
    <!-- Arrow -->
    <line x1="96" y1="80" x2="118" y2="80" stroke="#3a3a40" stroke-width="1.5"/>
    <polygon points="116,77 122,80 116,83" fill="#3a3a40"/>
    <!-- Pattern -->
    <rect x="124" y="40" width="170" height="80" rx="6" fill="#1ea366" stroke="#3a3a40" stroke-width="1.5"/>
    <text x="209" y="60" text-anchor="middle" fill="#fff" font-size="11">urls.py</text>
    <text x="209" y="80" text-anchor="middle" fill="#fff" font-size="11">path("blog/&lt;int:id&gt;/",</text>
    <text x="209" y="100" text-anchor="middle" fill="#fff" font-size="11">     views.detail)</text>
    <!-- Captured value below -->
    <text x="160" y="138" text-anchor="middle" font-size="9">→ views.detail(request, id=42)</text>
  </g>
</svg>
