<svg viewBox="0 0 320 160" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ansible YAML playbook with task list">
  <g font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#3a3a40">
    <rect x="20" y="20" width="280" height="120" rx="6" fill="#1f1f23" stroke="#3a3a40" stroke-width="1.5"/>
    <text x="34" y="44" fill="#9cdcfe">- name:</text>
    <text x="86" y="44" fill="#dcdcaa">Configure web</text>
    <text x="34" y="62" fill="#9cdcfe">  hosts:</text>
    <text x="86" y="62" fill="#ce9178">web</text>
    <text x="34" y="80" fill="#9cdcfe">  tasks:</text>
    <text x="42" y="98" fill="#fff">    - apt:</text>
    <text x="100" y="98" fill="#dcdcaa">{name: nginx}</text>
    <text x="42" y="116" fill="#fff">    - service:</text>
    <text x="118" y="116" fill="#dcdcaa">{name: nginx}</text>
    <text x="42" y="134" fill="#fff">    - template:</text>
    <text x="125" y="134" fill="#dcdcaa">nginx.conf.j2</text>
  </g>
</svg>
