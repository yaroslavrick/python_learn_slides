<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Stylized code window showing a Python snippet">
  <defs>
    <style>
      .frame { fill: #1f1f23; }
      .titlebar { fill: #2a2a30; }
      .filename { fill: #aaa; font-family: ui-monospace, Menlo, "SF Mono", monospace; font-size: 13px; }
      .ln { fill: #555; font-family: ui-monospace, Menlo, "SF Mono", monospace; font-size: 13px; }
      .kw { fill: #c586c0; font-family: ui-monospace, Menlo, "SF Mono", monospace; font-size: 15px; font-weight: 500; }
      .name { fill: #dcdcaa; font-family: ui-monospace, Menlo, "SF Mono", monospace; font-size: 15px; }
      .built { fill: #569cd6; font-family: ui-monospace, Menlo, "SF Mono", monospace; font-size: 15px; }
      .str { fill: #ce9178; font-family: ui-monospace, Menlo, "SF Mono", monospace; font-size: 15px; }
      .punct { fill: #ddd; font-family: ui-monospace, Menlo, "SF Mono", monospace; font-size: 15px; }
      .comment { fill: #6a9955; font-family: ui-monospace, Menlo, "SF Mono", monospace; font-size: 13px; font-style: italic; }
    </style>
  </defs>

  <!-- Window frame -->
  <rect class="frame" x="20" y="20" width="600" height="280" rx="10"/>
  <!-- Title bar -->
  <rect class="titlebar" x="20" y="20" width="600" height="34"/>
  <path d="M 20 47 L 620 47" stroke="#3a3a40" stroke-width="0.5"/>
  <!-- Mac-style window dots -->
  <circle cx="42" cy="37" r="6" fill="#ff5f57"/>
  <circle cx="62" cy="37" r="6" fill="#ffbd2e"/>
  <circle cx="82" cy="37" r="6" fill="#28c940"/>
  <text x="320" y="42" class="filename" text-anchor="middle">course.py</text>

  <!-- Line numbers -->
  <text x="50"  y="92"  class="ln" text-anchor="end">1</text>
  <text x="50"  y="116" class="ln" text-anchor="end">2</text>
  <text x="50"  y="140" class="ln" text-anchor="end">3</text>
  <text x="50"  y="164" class="ln" text-anchor="end">4</text>
  <text x="50"  y="188" class="ln" text-anchor="end">5</text>
  <text x="50"  y="212" class="ln" text-anchor="end">6</text>
  <text x="50"  y="236" class="ln" text-anchor="end">7</text>
  <text x="50"  y="260" class="ln" text-anchor="end">8</text>

  <!-- Line 1: comment -->
  <text x="70" y="92" class="comment"># A course in eight phases.</text>

  <!-- Line 3: def learn(): -->
  <text x="70" y="140">
    <tspan class="kw">def</tspan>
    <tspan class="name" dx="6">learn</tspan>
    <tspan class="punct">():</tspan>
  </text>

  <!-- Line 4:     while curious(): -->
  <text x="86" y="164">
    <tspan class="kw">while</tspan>
    <tspan class="name" dx="6">curious</tspan>
    <tspan class="punct">():</tspan>
  </text>

  <!-- Line 5:         read(); try_(); ship() -->
  <text x="118" y="188">
    <tspan class="name">read</tspan>
    <tspan class="punct">(); </tspan>
    <tspan class="name" dx="2">try_</tspan>
    <tspan class="punct">(); </tspan>
    <tspan class="name" dx="2">ship</tspan>
    <tspan class="punct">()</tspan>
  </text>

  <!-- Line 7: if __name__ == "__main__": -->
  <text x="70" y="236">
    <tspan class="kw">if</tspan>
    <tspan class="built" dx="6">__name__</tspan>
    <tspan class="punct" dx="4">==</tspan>
    <tspan class="str" dx="4">"__main__"</tspan>
    <tspan class="punct">:</tspan>
  </text>

  <!-- Line 8:     learn() -->
  <text x="86" y="260">
    <tspan class="name">learn</tspan>
    <tspan class="punct">()</tspan>
    <tspan class="punct" dx="6"> </tspan>
  </text>

  <!-- Blinking cursor -->
  <rect x="166" y="248" width="2" height="16" fill="#ddd">
    <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>
</svg>
