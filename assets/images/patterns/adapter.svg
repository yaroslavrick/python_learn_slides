<svg viewBox="0 0 160 80" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Adapter between two incompatible interfaces">
  <g font-family="ui-monospace, Menlo, monospace" font-size="8" fill="#3a3a40">
    <!-- Round plug -->
    <circle cx="22" cy="40" r="16" fill="#fec03f" stroke="#3a3a40" stroke-width="1.5"/>
    <text x="22" y="44" text-anchor="middle">.write()</text>
    <!-- Adapter -->
    <rect x="56" y="20" width="48" height="40" rx="6" fill="#fff" stroke="#3a3a40" stroke-width="2"/>
    <text x="80" y="38" text-anchor="middle">adapter</text>
    <text x="80" y="52" text-anchor="middle" font-size="7">.send→.write</text>
    <!-- Square plug -->
    <rect x="120" y="22" width="34" height="34" rx="2" fill="#28a745" stroke="#3a3a40" stroke-width="1.5"/>
    <text x="137" y="44" text-anchor="middle" fill="#fff">.send()</text>
  </g>
</svg>
