<svg viewBox="0 0 160 80" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Two families of factories producing related products">
  <g font-family="ui-monospace, Menlo, monospace" font-size="8" fill="#3a3a40">
    <!-- Family A -->
    <rect x="6" y="6" width="58" height="14" rx="2" fill="#1f8fff" stroke="#3a3a40" stroke-width="1.2"/>
    <text x="35" y="16" text-anchor="middle" fill="#fff">postgres_repos</text>
    <line x1="35" y1="20" x2="35" y2="28" stroke="#3a3a40" stroke-width="1"/>
    <rect x="6"  y="30" width="18" height="12" fill="#fff" stroke="#3a3a40" stroke-width="1"/>
    <text x="15" y="39" text-anchor="middle" font-size="7">user</text>
    <rect x="26" y="30" width="18" height="12" fill="#fff" stroke="#3a3a40" stroke-width="1"/>
    <text x="35" y="39" text-anchor="middle" font-size="7">order</text>
    <rect x="46" y="30" width="18" height="12" fill="#fff" stroke="#3a3a40" stroke-width="1"/>
    <text x="55" y="39" text-anchor="middle" font-size="7">item</text>
    <!-- Family B -->
    <rect x="96" y="6" width="58" height="14" rx="2" fill="#28a745" stroke="#3a3a40" stroke-width="1.2"/>
    <text x="125" y="16" text-anchor="middle" fill="#fff">memory_repos</text>
    <line x1="125" y1="20" x2="125" y2="28" stroke="#3a3a40" stroke-width="1"/>
    <rect x="96"  y="30" width="18" height="12" fill="#fff" stroke="#3a3a40" stroke-width="1"/>
    <text x="105" y="39" text-anchor="middle" font-size="7">user</text>
    <rect x="116" y="30" width="18" height="12" fill="#fff" stroke="#3a3a40" stroke-width="1"/>
    <text x="125" y="39" text-anchor="middle" font-size="7">order</text>
    <rect x="136" y="30" width="18" height="12" fill="#fff" stroke="#3a3a40" stroke-width="1"/>
    <text x="145" y="39" text-anchor="middle" font-size="7">item</text>
    <!-- Switch -->
    <text x="80" y="65" text-anchor="middle">swap by import</text>
  </g>
</svg>
