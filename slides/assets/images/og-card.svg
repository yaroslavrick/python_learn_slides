<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Python Course — slide-deck-driven curriculum">
  <defs>
    <style>
      .bg { fill: #1f1f23; }
      .titlebar { fill: #2a2a30; }
      .filename { fill: #aaa; font-family: ui-monospace, Menlo, "SF Mono", monospace; font-size: 22px; }
      .ln { fill: #555; font-family: ui-monospace, Menlo, "SF Mono", monospace; font-size: 22px; }
      .kw { fill: #c586c0; font-family: ui-monospace, Menlo, "SF Mono", monospace; font-size: 26px; }
      .name { fill: #dcdcaa; font-family: ui-monospace, Menlo, "SF Mono", monospace; font-size: 26px; }
      .built { fill: #569cd6; font-family: ui-monospace, Menlo, "SF Mono", monospace; font-size: 26px; }
      .str { fill: #ce9178; font-family: ui-monospace, Menlo, "SF Mono", monospace; font-size: 26px; }
      .punct { fill: #ddd; font-family: ui-monospace, Menlo, "SF Mono", monospace; font-size: 26px; }
      .comment { fill: #6a9955; font-family: ui-monospace, Menlo, "SF Mono", monospace; font-size: 22px; font-style: italic; }
      .title { fill: #f5f5f7; font-family: -apple-system, "Helvetica Neue", Arial, sans-serif; font-size: 76px; font-weight: 700; }
      .subtitle { fill: #b8b8c0; font-family: -apple-system, "Helvetica Neue", Arial, sans-serif; font-size: 30px; }
      .url { fill: #569cd6; font-family: ui-monospace, Menlo, "SF Mono", monospace; font-size: 22px; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1200" height="630"/>

  <text x="60" y="180" class="title">Python Course</text>
  <text x="60" y="232" class="subtitle">Slide-deck-driven curriculum</text>
  <text x="60" y="276" class="subtitle">Web · async · testing · data/AI</text>
  <text x="60" y="570" class="url">yaroslavrick.github.io/python_learn_slides</text>

  <rect class="bg" x="640" y="80" width="500" height="370" rx="14" stroke="#3a3a40" stroke-width="1"/>
  <rect class="titlebar" x="640" y="80" width="500" height="44" rx="14"/>
  <rect class="titlebar" x="640" y="100" width="500" height="24"/>
  <circle cx="668" cy="102" r="8" fill="#ff5f57"/>
  <circle cx="694" cy="102" r="8" fill="#ffbd2e"/>
  <circle cx="720" cy="102" r="8" fill="#28c940"/>
  <text x="890" y="109" class="filename" text-anchor="middle">course.py</text>

  <text x="680" y="172" class="ln" text-anchor="end">1</text>
  <text x="680" y="206" class="ln" text-anchor="end">2</text>
  <text x="680" y="240" class="ln" text-anchor="end">3</text>
  <text x="680" y="274" class="ln" text-anchor="end">4</text>
  <text x="680" y="308" class="ln" text-anchor="end">5</text>
  <text x="680" y="342" class="ln" text-anchor="end">6</text>
  <text x="680" y="376" class="ln" text-anchor="end">7</text>
  <text x="680" y="410" class="ln" text-anchor="end">8</text>

  <text x="700" y="172" class="comment"># Eight phases.</text>

  <text x="700" y="240">
    <tspan class="kw">def</tspan>
    <tspan class="name" dx="10">learn</tspan>
    <tspan class="punct">():</tspan>
  </text>

  <text x="730" y="274">
    <tspan class="kw">while</tspan>
    <tspan class="name" dx="10">curious</tspan>
    <tspan class="punct">():</tspan>
  </text>

  <text x="760" y="308">
    <tspan class="name">read</tspan>
    <tspan class="punct">();</tspan>
    <tspan class="name" dx="10">try_</tspan>
    <tspan class="punct">();</tspan>
    <tspan class="name" dx="10">ship</tspan>
    <tspan class="punct">()</tspan>
  </text>

  <text x="700" y="376">
    <tspan class="kw">if</tspan>
    <tspan class="built" dx="10">__name__</tspan>
    <tspan class="punct" dx="6">==</tspan>
    <tspan class="str" dx="6">"__main__"</tspan>
    <tspan class="punct">:</tspan>
  </text>

  <text x="730" y="410">
    <tspan class="name">learn</tspan>
    <tspan class="punct">()</tspan>
  </text>
</svg>
