<svg viewBox="0 0 160 80" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Subject broadcasting events to subscribers">
  <g font-family="ui-monospace, Menlo, monospace" font-size="9" fill="#3a3a40">
    <rect x="6"  y="28" width="44" height="24" rx="3" fill="#cd5555" stroke="#3a3a40" stroke-width="1.5"/>
    <text x="28" y="43" text-anchor="middle" fill="#fff">subject</text>
    <!-- Three arrows fanning out -->
    <line x1="50" y1="40" x2="100" y2="14" stroke="#3a3a40" stroke-width="1.5"/>
    <polygon points="98,11 104,14 98,17" fill="#3a3a40"/>
    <line x1="50" y1="40" x2="100" y2="40" stroke="#3a3a40" stroke-width="1.5"/>
    <polygon points="98,37 104,40 98,43" fill="#3a3a40"/>
    <line x1="50" y1="40" x2="100" y2="66" stroke="#3a3a40" stroke-width="1.5"/>
    <polygon points="98,63 104,66 98,69" fill="#3a3a40"/>
    <!-- Subscribers -->
    <rect x="106" y="4"  width="50" height="20" rx="3" fill="#fff" stroke="#3a3a40" stroke-width="1.2"/>
    <text x="131" y="17" text-anchor="middle">handler 1</text>
    <rect x="106" y="30" width="50" height="20" rx="3" fill="#fff" stroke="#3a3a40" stroke-width="1.2"/>
    <text x="131" y="43" text-anchor="middle">handler 2</text>
    <rect x="106" y="56" width="50" height="20" rx="3" fill="#fff" stroke="#3a3a40" stroke-width="1.2"/>
    <text x="131" y="69" text-anchor="middle">handler 3</text>
  </g>
</svg>
