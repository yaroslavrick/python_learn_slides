<svg viewBox="0 0 160 80" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A simple facade hiding many subsystems">
  <g font-family="ui-monospace, Menlo, monospace" font-size="9" fill="#3a3a40">
    <rect x="6" y="22" width="44" height="36" rx="4" fill="#fec03f" stroke="#3a3a40" stroke-width="1.5"/>
    <text x="28" y="44" text-anchor="middle">boot()</text>
    <line x1="50" y1="40" x2="64" y2="40" stroke="#3a3a40" stroke-width="1.5"/>
    <polygon points="62,37 68,40 62,43" fill="#3a3a40"/>
    <!-- Subsystem cogs -->
    <rect x="74"  y="6"  width="32" height="14" rx="2" fill="#fff" stroke="#3a3a40" stroke-width="1"/>
    <text x="90"  y="16" text-anchor="middle" font-size="7">disk</text>
    <rect x="74"  y="24" width="32" height="14" rx="2" fill="#fff" stroke="#3a3a40" stroke-width="1"/>
    <text x="90"  y="34" text-anchor="middle" font-size="7">cpu</text>
    <rect x="74"  y="42" width="32" height="14" rx="2" fill="#fff" stroke="#3a3a40" stroke-width="1"/>
    <text x="90"  y="52" text-anchor="middle" font-size="7">memory</text>
    <rect x="74"  y="60" width="32" height="14" rx="2" fill="#fff" stroke="#3a3a40" stroke-width="1"/>
    <text x="90"  y="70" text-anchor="middle" font-size="7">io</text>
    <rect x="114" y="6"  width="40" height="14" rx="2" fill="#fff" stroke="#3a3a40" stroke-width="1"/>
    <text x="134" y="16" text-anchor="middle" font-size="7">network</text>
    <rect x="114" y="24" width="40" height="14" rx="2" fill="#fff" stroke="#3a3a40" stroke-width="1"/>
    <text x="134" y="34" text-anchor="middle" font-size="7">drivers</text>
    <rect x="114" y="42" width="40" height="14" rx="2" fill="#fff" stroke="#3a3a40" stroke-width="1"/>
    <text x="134" y="52" text-anchor="middle" font-size="7">modules</text>
    <rect x="114" y="60" width="40" height="14" rx="2" fill="#fff" stroke="#3a3a40" stroke-width="1"/>
