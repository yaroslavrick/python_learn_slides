<svg viewBox="0 0 320 160" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Server speaking WSGI or ASGI to a Python framework">
  <g font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#3a3a40">
    <!-- Server -->
    <rect x="10" y="40" width="84" height="80" rx="4" fill="#1f8fff" stroke="#3a3a40" stroke-width="1.5"/>
    <text x="52" y="64" text-anchor="middle" fill="#fff">gunicorn</text>
    <text x="52" y="80" text-anchor="middle" fill="#fff" font-size="9">/</text>
    <text x="52" y="96" text-anchor="middle" fill="#fff">uvicorn</text>
    <!-- WSGI / ASGI labels -->
    <text x="155" y="62" text-anchor="middle" font-size="10">WSGI (sync)</text>
    <line x1="98" y1="68" x2="212" y2="68" stroke="#3a3a40" stroke-width="1.5" stroke-dasharray="4 2"/>
    <polygon points="210,65 216,68 210,71" fill="#3a3a40"/>
    <text x="155" y="100" text-anchor="middle" font-size="10">ASGI (async + WS)</text>
    <line x1="98" y1="92" x2="212" y2="92" stroke="#3a3a40" stroke-width="1.5"/>
    <polygon points="210,89 216,92 210,95" fill="#3a3a40"/>
    <!-- Framework -->
    <rect x="216" y="40" width="92" height="80" rx="4" fill="#28a745" stroke="#3a3a40" stroke-width="1.5"/>
    <text x="262" y="62" text-anchor="middle" fill="#fff">Django</text>
    <text x="262" y="80" text-anchor="middle" fill="#fff" font-size="9">/</text>
    <text x="262" y="96" text-anchor="middle" fill="#fff">FastAPI</text>
  </g>
</svg>
