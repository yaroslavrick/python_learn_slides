<svg viewBox="0 0 320 160" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Template with variable placeholders being filled with context">
  <g font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#3a3a40">
    <!-- Template box -->
    <rect x="20" y="20" width="180" height="120" rx="6" fill="#fff" stroke="#3a3a40" stroke-width="1.5"/>
    <text x="110" y="40" text-anchor="middle" font-size="10" fill="#888">detail.html</text>
    <line x1="20" y1="48" x2="200" y2="48" stroke="#ddd"/>
    <text x="34" y="68">&lt;h1&gt;</text>
    <rect x="68" y="58" width="76" height="14" rx="2" fill="#fec03f" stroke="#3a3a40" stroke-width="1"/>
    <text x="106" y="68" text-anchor="middle" font-size="9">{ post.title }</text>
    <text x="146" y="68">&lt;/h1&gt;</text>
    <text x="34" y="92">&lt;p&gt;</text>
    <rect x="60" y="82" width="100" height="14" rx="2" fill="#fec03f" stroke="#3a3a40" stroke-width="1"/>
    <text x="110" y="92" text-anchor="middle" font-size="9">{ post.body }</text>
    <text x="160" y="92">&lt;/p&gt;</text>
    <text x="34" y="120" font-size="10">{% if user %}</text>
    <text x="40" y="134" font-size="10" fill="#888">  ...</text>
    <!-- Context arrow -->
    <line x1="200" y1="80" x2="230" y2="80" stroke="#3a3a40" stroke-width="1.5"/>
    <polygon points="228,77 234,80 228,83" fill="#3a3a40"/>
    <!-- Context -->
    <rect x="238" y="50" width="72" height="60" rx="4" fill="#1ea366" stroke="#3a3a40" stroke-width="1.5"/>
    <text x="274" y="68" text-anchor="middle" fill="#fff" font-size="10">context</text>
    <text x="274" y="84" text-anchor="middle" fill="#fff" font-size="9">{post: ...}</text>
    <text x="274" y="100" text-anchor="middle" fill="#fff" font-size="9">{user: ...}</text>
  </g>
</svg>
