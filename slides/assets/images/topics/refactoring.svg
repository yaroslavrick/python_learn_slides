<svg viewBox="0 0 320 160" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Tangled code becoming clean code">
  <!-- Left: tangled lines -->
  <g stroke="#cd5555" stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M 25 40 Q 60 60 30 80 Q 80 100 35 120"/>
    <path d="M 50 35 Q 90 70 45 95 Q 100 115 55 130"/>
    <path d="M 80 45 Q 50 80 95 95 Q 60 110 105 125"/>
  </g>
  <!-- Arrow -->
  <g stroke="#3a3a40" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <line x1="135" y1="80" x2="195" y2="80"/>
    <polyline points="180,68 195,80 180,92"/>
  </g>
  <!-- Right: clean horizontal lines -->
  <g stroke="#28a745" stroke-width="3" stroke-linecap="round">
    <line x1="220" y1="50" x2="295" y2="50"/>
    <line x1="220" y1="70" x2="280" y2="70"/>
    <line x1="220" y1="90" x2="290" y2="90"/>
    <line x1="220" y1="110" x2="270" y2="110"/>
    <line x1="220" y1="130" x2="285" y2="130"/>
  </g>
</svg>
