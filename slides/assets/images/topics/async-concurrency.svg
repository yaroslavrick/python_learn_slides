<svg viewBox="0 0 320 160" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Three concurrent tasks on an event loop, each with awaits">
  <g font-family="ui-monospace, Menlo, monospace" font-size="10" fill="#3a3a40">
    <text x="14" y="20" font-size="11">event loop</text>
    <!-- Task A -->
    <text x="14" y="46">A</text>
    <line x1="30" y1="42" x2="120" y2="42" stroke="#1f8fff" stroke-width="3"/>
    <line x1="120" y1="42" x2="160" y2="42" stroke="#1f8fff" stroke-width="3" stroke-dasharray="3 3"/>
    <line x1="160" y1="42" x2="240" y2="42" stroke="#1f8fff" stroke-width="3"/>
    <text x="135" y="36" text-anchor="middle" font-size="8">await I/O</text>
    <!-- Task B -->
    <text x="14" y="76">B</text>
    <line x1="30" y1="72" x2="80" y2="72" stroke="#fec03f" stroke-width="3"/>
    <line x1="80" y1="72" x2="180" y2="72" stroke="#fec03f" stroke-width="3" stroke-dasharray="3 3"/>
    <line x1="180" y1="72" x2="240" y2="72" stroke="#fec03f" stroke-width="3"/>
    <text x="130" y="66" text-anchor="middle" font-size="8">await DB</text>
    <!-- Task C -->
    <text x="14" y="106">C</text>
    <line x1="30" y1="102" x2="60" y2="102" stroke="#28a745" stroke-width="3"/>
    <line x1="60" y1="102" x2="200" y2="102" stroke="#28a745" stroke-width="3" stroke-dasharray="3 3"/>
    <line x1="200" y1="102" x2="240" y2="102" stroke="#28a745" stroke-width="3"/>
    <text x="130" y="96" text-anchor="middle" font-size="8">await net</text>
    <!-- Time axis -->
    <line x1="30" y1="130" x2="280" y2="130" stroke="#3a3a40" stroke-width="1"/>
    <polygon points="278,127 284,130 278,133" fill="#3a3a40"/>
    <text x="280" y="142" text-anchor="middle" font-size="8">time</text>
    <text x="14" y="138" font-size="8">solid = running</text>
    <text x="155" y="138" font-size="8">dashed = awaiting (others run)</text>
  </g>
</svg>
