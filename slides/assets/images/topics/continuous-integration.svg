<svg viewBox="0 0 320 160" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A circular CI loop with stages and a green status">
  <g font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#3a3a40">
    <!-- Loop circle -->
    <circle cx="160" cy="80" r="60" fill="none" stroke="#3a3a40" stroke-width="2.5" stroke-dasharray="4 3"/>
    <!-- Arrowhead on the loop -->
    <polygon points="218,75 230,80 218,86" fill="#3a3a40"/>

    <!-- Stage chips -->
    <g>
      <rect x="123" y="8"   width="74" height="22" rx="11" fill="#fec03f" stroke="#3a3a40" stroke-width="1.5"/>
      <text x="160" y="23" text-anchor="middle">push</text>

      <rect x="223" y="69"  width="74" height="22" rx="11" fill="#1f8fff" stroke="#3a3a40" stroke-width="1.5"/>
      <text x="260" y="84" text-anchor="middle" fill="#fff">test</text>

      <rect x="123" y="130" width="74" height="22" rx="11" fill="#28a745" stroke="#3a3a40" stroke-width="1.5"/>
      <text x="160" y="145" text-anchor="middle" fill="#fff">deploy</text>

      <rect x="23"  y="69"  width="74" height="22" rx="11" fill="#fff"     stroke="#3a3a40" stroke-width="1.5"/>
      <text x="60"  y="84" text-anchor="middle">review</text>
    </g>
  </g>
</svg>
