<svg viewBox="0 0 320 160" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Given / When / Then scenario">
  <g font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#3a3a40">
    <text x="20" y="36" font-weight="bold" fill="#1ea366">Given</text>
    <text x="80" y="36">an empty cart</text>

    <text x="20" y="68" font-weight="bold" fill="#1f8fff">When</text>
    <text x="80" y="68">alice adds a book</text>

    <text x="20" y="100" font-weight="bold" fill="#cd5555">Then</text>
    <text x="80" y="100">cart contains 1 item</text>

    <text x="20" y="124" font-weight="bold" fill="#cd5555">And</text>
    <text x="80" y="124">total is 12.99</text>

    <!-- bottom line -->
    <line x1="20" y1="146" x2="300" y2="146" stroke="#aaa" stroke-width="1"/>
    <text x="160" y="156" text-anchor="middle" font-size="10" fill="#888">cart.feature</text>
  </g>
</svg>
