<svg viewBox="0 0 320 160" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A small DataFrame table with three rows">
  <g font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#3a3a40">
    <!-- header -->
    <rect x="20" y="20" width="280" height="22" fill="#3a3a40"/>
    <text x="50"  y="36" fill="#fff">name</text>
    <text x="140" y="36" fill="#fff">age</text>
    <text x="220" y="36" fill="#fff">city</text>
    <!-- rows -->
    <rect x="20" y="42" width="280" height="22" fill="#fff" stroke="#3a3a40" stroke-width="0.5"/>
    <text x="50"  y="58">Alice</text>
    <text x="140" y="58">30</text>
    <text x="220" y="58">NYC</text>

    <rect x="20" y="64" width="280" height="22" fill="#f6f6f6" stroke="#3a3a40" stroke-width="0.5"/>
    <text x="50"  y="80">Bob</text>
    <text x="140" y="80">25</text>
    <text x="220" y="80">LA</text>

    <rect x="20" y="86" width="280" height="22" fill="#fff" stroke="#3a3a40" stroke-width="0.5"/>
    <text x="50"  y="102">Carol</text>
    <text x="140" y="102">35</text>
    <text x="220" y="102">NYC</text>

    <text x="20"  y="138" font-size="10">df.groupby("city")["age"].mean()  →  {LA: 25, NYC: 32.5}</text>
  </g>
</svg>
