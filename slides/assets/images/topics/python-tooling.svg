<svg viewBox="0 0 320 160" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A toolbox with a wrench and a checkmark">
  <!-- Toolbox -->
  <rect x="60" y="60" width="200" height="80" rx="6" fill="#fec03f" stroke="#3a3a40" stroke-width="2"/>
  <rect x="60" y="60" width="200" height="20" fill="#3a3a40"/>
  <!-- Handle -->
  <rect x="130" y="38" width="60" height="22" rx="6" fill="none" stroke="#3a3a40" stroke-width="3"/>
  <!-- Wrench -->
  <g transform="translate(80 95) rotate(-30)" stroke="#3a3a40" stroke-width="2.5" fill="#fff" stroke-linejoin="round">
    <path d="M 0 0 L 40 0 L 50 10 L 40 20 L 0 20 Z"/>
    <circle cx="-12" cy="10" r="10"/>
  </g>
  <!-- Checkmark badge -->
  <circle cx="225" cy="105" r="18" fill="#28a745" stroke="#3a3a40" stroke-width="2"/>
  <path d="M 215 105 L 222 113 L 235 98" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
