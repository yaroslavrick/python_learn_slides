<svg viewBox="0 0 320 160" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="REST endpoints: GET, POST, PATCH, DELETE">
  <g font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#3a3a40">
    <!-- GET -->
    <rect x="20" y="14"  width="60" height="22" rx="11" fill="#1ea366" stroke="#3a3a40" stroke-width="1.2"/>
    <text x="50" y="29" text-anchor="middle" fill="#fff" font-weight="bold">GET</text>
    <text x="92" y="29">/posts/</text>

    <rect x="20" y="46"  width="60" height="22" rx="11" fill="#fec03f" stroke="#3a3a40" stroke-width="1.2"/>
    <text x="50" y="61" text-anchor="middle" font-weight="bold">POST</text>
    <text x="92" y="61">/posts/</text>

    <rect x="20" y="78"  width="60" height="22" rx="11" fill="#1f8fff" stroke="#3a3a40" stroke-width="1.2"/>
    <text x="50" y="93" text-anchor="middle" fill="#fff" font-weight="bold">PATCH</text>
    <text x="92" y="93">/posts/42/</text>

    <rect x="20" y="110" width="60" height="22" rx="11" fill="#cd5555" stroke="#3a3a40" stroke-width="1.2"/>
    <text x="50" y="125" text-anchor="middle" fill="#fff" font-weight="bold">DELETE</text>
    <text x="92" y="125">/posts/42/</text>

    <!-- Response sample -->
    <rect x="200" y="38" width="106" height="84" rx="4" fill="#1f1f23" stroke="#3a3a40" stroke-width="1.2"/>
    <text x="210" y="56" font-size="10" fill="#dcdcaa">{</text>
    <text x="220" y="72" font-size="10" fill="#9cdcfe">"id": </text>
    <text x="252" y="72" font-size="10" fill="#ce9178">42,</text>
    <text x="220" y="88" font-size="10" fill="#9cdcfe">"title":</text>
    <text x="220" y="104" font-size="10" fill="#ce9178">"Hello"</text>
    <text x="210" y="120" font-size="10" fill="#dcdcaa">}</text>
  </g>
</svg>
