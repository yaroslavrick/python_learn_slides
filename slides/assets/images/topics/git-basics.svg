<svg viewBox="0 0 320 160" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Git commit graph with main and feature branch">
  <g font-family="ui-monospace, Menlo, monospace" font-size="10" fill="#3a3a40">
    <line x1="20" y1="60" x2="300" y2="60" stroke="#3a3a40" stroke-width="2"/>
    <text x="20" y="50" font-size="9">main</text>
    <circle cx="40" cy="60" r="9" fill="#1f8fff" stroke="#3a3a40" stroke-width="1.5"/>
    <circle cx="100" cy="60" r="9" fill="#1f8fff" stroke="#3a3a40" stroke-width="1.5"/>
    <circle cx="220" cy="60" r="9" fill="#1f8fff" stroke="#3a3a40" stroke-width="1.5"/>
    <circle cx="280" cy="60" r="9" fill="#1f8fff" stroke="#3a3a40" stroke-width="1.5"/>
    <line x1="100" y1="60" x2="160" y2="110" stroke="#fec03f" stroke-width="2"/>
    <line x1="160" y1="110" x2="220" y2="60" stroke="#fec03f" stroke-width="2"/>
    <text x="20" y="118" font-size="9">feature</text>
