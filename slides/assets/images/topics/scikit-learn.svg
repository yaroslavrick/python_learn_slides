<svg viewBox="0 0 320 160" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Train and test split flowing through fit and predict">
  <g font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#3a3a40">
    <rect x="6" y="14" width="80" height="36" rx="4" fill="#28a745" stroke="#3a3a40" stroke-width="1.5"/>
    <text x="46" y="38" text-anchor="middle" fill="#fff">X_train</text>
    <line x1="86" y1="32" x2="120" y2="60" stroke="#3a3a40" stroke-width="1.5"/>
    <polygon points="118,57 122,62 116,60" fill="#3a3a40"/>

    <rect x="6" y="56" width="80" height="36" rx="4" fill="#28a745" stroke="#3a3a40" stroke-width="1.5"/>
    <text x="46" y="80" text-anchor="middle" fill="#fff">y_train</text>
    <line x1="86" y1="74" x2="120" y2="74" stroke="#3a3a40" stroke-width="1.5"/>
    <polygon points="118,71 124,74 118,77" fill="#3a3a40"/>

    <rect x="120" y="50" width="80" height="50" rx="4" fill="#1f8fff" stroke="#3a3a40" stroke-width="1.5"/>
    <text x="160" y="72" text-anchor="middle" fill="#fff">model</text>
    <text x="160" y="88" text-anchor="middle" fill="#fff" font-size="9">.fit(X, y)</text>

    <rect x="6" y="106" width="80" height="36" rx="4" fill="#fec03f" stroke="#3a3a40" stroke-width="1.5"/>
    <text x="46" y="130" text-anchor="middle">X_test</text>
    <line x1="86" y1="124" x2="120" y2="100" stroke="#3a3a40" stroke-width="1.5"/>
    <polygon points="120,103 124,98 118,100" fill="#3a3a40"/>

    <line x1="200" y1="74" x2="240" y2="74" stroke="#3a3a40" stroke-width="1.5"/>
    <polygon points="238,71 244,74 238,77" fill="#3a3a40"/>

    <rect x="244" y="56" width="68" height="40" rx="4" fill="#cd5555" stroke="#3a3a40" stroke-width="1.5"/>
    <text x="278" y="74" text-anchor="middle" fill="#fff">y_pred</text>
    <text x="278" y="86" text-anchor="middle" fill="#fff" font-size="9">.predict()</text>
  </g>
</svg>
