<svg viewBox="0 0 320 160" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A Django project containing multiple apps">
  <g font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#3a3a40" stroke="#3a3a40">
    <!-- Project outline -->
    <rect x="10" y="20" width="300" height="120" rx="8" fill="none" stroke-width="2" stroke-dasharray="4 3"/>
    <text x="160" y="14" text-anchor="middle" font-size="10" stroke="none">project</text>
    <!-- Apps inside -->
    <rect x="30" y="44" width="84" height="36" rx="4" fill="#1ea366" stroke-width="1.5"/>
    <text x="72" y="66" text-anchor="middle" stroke="none" fill="#fff">accounts</text>
    <rect x="124" y="44" width="84" height="36" rx="4" fill="#1ea366" stroke-width="1.5"/>
    <text x="166" y="66" text-anchor="middle" stroke="none" fill="#fff">blog</text>
    <rect x="218" y="44" width="84" height="36" rx="4" fill="#1ea366" stroke-width="1.5"/>
    <text x="260" y="66" text-anchor="middle" stroke="none" fill="#fff">billing</text>

    <rect x="30"  y="92" width="84" height="36" rx="4" fill="#1ea366" stroke-width="1.5"/>
    <text x="72"  y="114" text-anchor="middle" stroke="none" fill="#fff">api</text>
    <rect x="124" y="92" width="84" height="36" rx="4" fill="#1ea366" stroke-width="1.5"/>
    <text x="166" y="114" text-anchor="middle" stroke="none" fill="#fff">notifications</text>
    <rect x="218" y="92" width="84" height="36" rx="4" fill="#fec03f" stroke-width="1.5"/>
    <text x="260" y="110" text-anchor="middle" stroke="none">django-allauth</text>
    <text x="260" y="123" text-anchor="middle" stroke="none" font-size="8">(third-party)</text>
  </g>
</svg>
