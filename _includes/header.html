<head>
  <meta charset="utf-8">
  <title>{% if page.title %}{{ page.title | escape }} — {{ site.title | escape }}{% else %}{{ site.title | escape }}{% endif %}</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="{{ page.description | default: site.description | strip_html | normalize_whitespace | truncate: 160 | escape }}">

  <link rel="icon" type="image/svg+xml" href="{{ '/assets/images/favicon.svg' | relative_url }}">

  {%- assign og_title = page.title | default: site.title -%}
  {%- assign og_description = page.description | default: site.description | strip_html | normalize_whitespace | truncate: 200 -%}
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="{{ site.title | escape }}">
  <meta property="og:title" content="{{ og_title | escape }}">
  <meta property="og:description" content="{{ og_description | escape }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta property="og:image" content="{{ '/assets/images/og-card.png' | absolute_url }}">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{ og_title | escape }}">
  <meta name="twitter:description" content="{{ og_description | escape }}">
  <meta name="twitter:image" content="{{ '/assets/images/og-card.png' | absolute_url }}">

  <link rel="stylesheet" href="{{ '/vendor/reveal.js/dist/reset.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/vendor/reveal.js/dist/reveal.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/vendor/reveal.js/dist/theme/white.css' | relative_url }}" id="theme">
  <link rel="stylesheet" href="{{ '/vendor/reveal.js/dist/plugin/highlight/monokai.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/theme.css' | relative_url }}">
</head>
