<script src="{{ '/vendor/reveal.js/dist/reveal.js' | relative_url }}"></script>
<script src="{{ '/vendor/reveal.js/dist/plugin/markdown.js' | relative_url }}"></script>
<script src="{{ '/vendor/reveal.js/dist/plugin/highlight.js' | relative_url }}"></script>
<script src="{{ '/vendor/reveal.js/dist/plugin/notes.js' | relative_url }}"></script>
<script>
  Reveal.initialize({
    hash: true,
    history: true,
    slideNumber: 'c/t',
    transition: 'slide',
    transitionSpeed: 'fast',
    width: 1280,
    height: 800,
    margin: 0.04,
    minScale: 0.2,
    maxScale: 1.5,
    plugins: [RevealMarkdown, RevealHighlight, RevealNotes]
  });

  function addCopyButtons() {
    document.querySelectorAll('.reveal pre').forEach(function (pre) {
      if (pre.querySelector('.copy-btn')) return;
      var btn = document.createElement('button');
      btn.className = 'copy-btn';
      btn.type = 'button';
      btn.setAttribute('aria-label', 'Copy code');
      btn.textContent = 'Copy';
      btn.addEventListener('click', function (e) {
        e.stopPropagation();
        var code = pre.querySelector('code');
        var text = code ? code.textContent : pre.textContent;
        navigator.clipboard.writeText(text).then(function () {
          btn.textContent = 'Copied';
          btn.classList.add('copied');
          setTimeout(function () {
            btn.textContent = 'Copy';
            btn.classList.remove('copied');
          }, 1500);
        }, function () {
          btn.textContent = 'Failed';
        });
      });
      pre.appendChild(btn);
    });
  }

  Reveal.on('ready', addCopyButtons);
</script>
