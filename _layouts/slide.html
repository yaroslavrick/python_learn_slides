<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: 'en' }}">
  {% include header.html %}
  <body>
    <a class="home-link" href="{{ '/' | relative_url }}" aria-label="Back to course index">
      <svg class="home-icon" width="14" height="14" viewBox="0 0 14 14" aria-hidden="true">
        <rect x="1"  y="1"  width="5" height="5" rx="0.6" fill="currentColor"/>
        <rect x="8"  y="1"  width="5" height="5" rx="0.6" fill="currentColor"/>
        <rect x="1"  y="8"  width="5" height="5" rx="0.6" fill="currentColor"/>
        <rect x="8"  y="8"  width="5" height="5" rx="0.6" fill="currentColor"/>
      </svg>
      <span>Index</span>
    </a>
    <div class="reveal">
      <div class="slides">
        <section data-markdown
                 data-separator="^\r?\n---\r?\n$"
                 data-separator-vertical="^\r?\n--\r?\n$"
                 data-notes="^Note:">
          <script type="text/template">
{{ page.content }}
          </script>
        </section>
      </div>
    </div>
    {% include footer.html %}
  </body>
</html>
